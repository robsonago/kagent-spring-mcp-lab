name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build e testes (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: service-catalog
        run: mvn -B verify

  e2e-mcp:
    name: MCP Server no kind (sem LLM)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Cria cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: kagent-lab
      - name: Build da imagem e carga no kind
        run: |
          docker build -t service-catalog:0.1.0 service-catalog
          kind load docker-image service-catalog:0.1.0 --name kagent-lab
      - name: Deploy
        run: |
          kubectl apply -f k8s/catalog/service-catalog.yaml
          kubectl -n catalog rollout status deployment/service-catalog --timeout=300s
      - name: tools/list via Service
        run: |
          kubectl -n catalog port-forward svc/service-catalog 18080:8080 &
          sleep 5
          curl -sS -X POST http://127.0.0.1:18080/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | tee /tmp/tools.json
          for t in list_services get_service_owner get_runbook check_change_freeze; do
            grep -q "\"$t\"" /tmp/tools.json
          done
      - name: Logs em caso de falha
        if: failure()
        run: kubectl -n catalog logs -l app.kubernetes.io/name=service-catalog --tail=200
