# MCP Server (Spring Boot) que expõe o catálogo de serviços para os agentes.
apiVersion: v1
kind: Namespace
metadata:
  name: catalog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-catalog
  namespace: catalog
  labels:
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/part-of: kagent-lab
spec:
  # STATELESS permite mais de uma réplica sem sticky session.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: service-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-catalog
        app.kubernetes.io/part-of: kagent-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Imagem construída localmente e carregada no kind (scripts/03-build-and-load.sh)
          image: service-catalog:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-catalog
  namespace: catalog
  labels:
    app.kubernetes.io/name: service-catalog
spec:
  selector:
    app.kubernetes.io/name: service-catalog
  ports:
    - name: http
      port: 8080
      targetPort: http
